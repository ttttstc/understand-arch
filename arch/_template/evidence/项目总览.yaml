# Schema: internal/schemas/项目总览.schema.json
# Owner skill: arch-frame
# Status: STUB — arch-frame populates required fields on first run.
#
# This is the root evidence artifact. Every other yaml's evidence_refs
# back-link to entries here. Do not hand-edit unless you know what you
# are doing — use /arch-frame to regenerate.

project_name: ""              # kebab-case, max 40 chars
generated_at: ""              # ISO 8601
generated_by: "arch-frame"
mode: ""                      # onboard | audit | design | brief
baseline_commits: {}          # repo -> commit hash

design_intent:
  # arch-frame fills this from the PRD or user interview.
  problem_statement: ""
  business_goals: []
  non_goals: []
  acceptance_criteria: []

architecture_profile:
  # arch-frame infers this from analyzing the codebase + design_intent.
  identified_styles: []        # e.g., [微服务, REST API, LLM 应用 + RAG]
  primary_concerns: []         # e.g., [可靠性, 成本, 召回质量]
  recommended_references: []   # paths under arch-library/
  recommended_phases: []       # names from internal/phases/
  recommended_diagram_style: ""
  user_override: null

org_constraints:
  # Loaded from ~/.understand-arch/kb/ when present, else empty + degraded=true.
  tech_radar: []
  banned_patterns: []
  naming_conventions: []
  network_boundaries: []
  compliance_redlines: []
  loaded_from: ""              # path to KB or "(none)"
  degraded: false

evidence_refs:
  # Every concrete claim above should cite a source.
  # Format: { source: <path or url>, lines: "L1-L20", note: "..." }
  - source: ""
    lines: ""
    note: ""
