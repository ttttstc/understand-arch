gate: design
version: "2.0"
applies_to: arch-design
structural:
  - id: single-cr-md
    rule: "change-requests/CR-*/CR.md 存在,不得拆成 impact.yaml/review.yaml/traceability.yaml"
  - id: frontmatter-schema
    schema: "internal/schemas/cr.schema.json"
  - id: fourteen-sections
    rule: "CR.md 正文 14 段全产,第 14 段为 Review"
semantic:
  - id: impact-coverage
    rule: "影响面覆盖仓库、组件、接口、数据、部署、配置、权限与观测"
  - id: graph-consistency
    rule: "CR 中事实不得与 graph 矛盾"
  - id: rules-conformance
    rule: "方案显式检查 rules/*.md,冲突必须列为风险或 blocker"
  - id: traceability-writeback
    rule: "cross-repo.json#change_requests[] 与 traceability[] 追加本 CR 引用"
  - id: senior-review-tool
    rule: "engine/bin/senior-review.js --mode design 返回 pass 或 needs_revision,不得缺失 verdict"
reviewer:
  agent: arch-senior-reviewer
  mode: design
verdict:
  pass: "overall_score >= 0.85 且无 blocker"
  needs_revision: "overall_score 0.6-0.85 或有 major findings"
  fail: "overall_score < 0.6 或有 blocker"
