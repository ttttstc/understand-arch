mode: brief
purpose: "Repackage existing architecture evidence for a specific audience."

structural_gate:
  required: true
  must_have:
    - "user/汇报/{date}-{audience}.md exists (single file, no nested directory)"
    - "when audience=management, file is one page or less"
    - "every claim links to an upstream artifact in user/ or agent/证据/"
    - "frontmatter records generated_at + source_package (path to audit / wiki snapshot used)"

semantic_gate:
  threshold: "all"
  allows_degraded: false
  questions:
    - id: audience-fit
      asks: "Is the emphasis appropriate for the chosen audience?"
    - id: no-new-facts
      asks: "Does the brief avoid introducing facts absent from source evidence?"
    - id: decision-clarity
      asks: "Is the ask, risk, or takeaway explicit?"
    - id: evidence-traceability
      asks: "Can every important number or conclusion be traced back?"

retry_policy:
  max_retries: 2
  on_failure: "retry arch-pack with verifier notes"
