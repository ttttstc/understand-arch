gate: audit
version: "2.0"
applies_to: arch-audit
structural:
  - id: deterministic-tool
    command: "node engine/bin/audit-workspace.js --workspace .understand-arch/{project}"
  - id: state-readable
    schema: "internal/schemas/state.schema.json"
  - id: graph-readable
    rule: "repos.yaml、repo graph、cross-repo graph 均可读取"
  - id: report
    rule: "需要落盘时只写 audit-{date}.md"
semantic:
  - id: freshness
    rule: "每仓 fingerprint 对比结果为 fresh、stale 或 unknown;workspace 可汇总为 degraded"
  - id: degraded-visible
    rule: "state.yaml.overrides[] 与 degraded 状态必须在报告中显式展示"
  - id: wiki-review
    rule: "wiki 完整性由 engine/bin/wiki-review.js --mode lite/full 独立检查"
  - id: user-choice
    rule: "stale 时给用户刷新、查看漂移详情、override 三选项"
verdict:
  pass: "完成 freshness 与完整性判断"
  needs_revision: "报告缺少 degraded 或 override 信息"
  fail: "写入 graph/wiki/CR/ADR 或无法读取核心事实层"
