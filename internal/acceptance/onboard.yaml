gate: onboard
version: "2.0"
applies_to: arch-onboard
structural:
  - id: workspace-root
    must_exist:
      - ".understand-arch/.gitignore"
      - ".understand-arch/{project}/state.yaml"
      - ".understand-arch/{project}/specs/repos.yaml"
      - ".understand-arch/{project}/specs/cross-repo.json"
  - id: per-repo-graph
    rule: "repos.yaml 每个 repo 都必须有 specs/repos/{repo_id}/knowledge-graph.json 与 .fingerprint.json"
  - id: wiki-pages
    rule: "wiki/README.md + 14 页全部存在"
semantic:
  - id: node-id-prefix
    rule: "所有 node.id 都匹配 {repo_id}::{local-id}"
  - id: cross-edge-split
    rule: "跨仓 edge 只能写入 cross-repo.json#cross_edges"
  - id: cross-edge-evidence
    rule: "每条 cross_edges[] 都必须 cross_repo=true,且带 evidence_refs 或来自确定性仓内 edge 分流"
  - id: traceable-wiki
    rule: "wiki 关键断言可回链 graph node id、ADR/CR 路径或 rules path"
reviewer:
  agent: arch-graph-reviewer
  modes:
    - phase-1
    - phase-3
    - phase-4
    - phase-5
    - phase-6
    - phase-7
    - phase-8
verdict:
  pass: "全部 structural 通过且 reviewer 无 blocker"
  needs_revision: "存在 major findings 或 traceability 低于 95%"
  fail: "schema 不通过、graph 缺失或写出 scope"
