name: wiki
version: 3.0
pages:
  - 01-overview.md
  - 02-components.md
  - 03-interfaces.md
  - 04-data-models.md
  - 05-capabilities.md
  - 06-quality.md
  - 07-risks-and-debt.md
  - 08-deployments.md
  - 09-flows-and-scenarios.md
  - 10-decisions.md
  - 11-changes.md
  - 12-rules.md
  - 13-pending-changes.md
  - 14-diagrams.md
gates:
  - id: projection-complete
    severity: fail
    check: non-empty arch-layer sections must be covered by their mapped wiki pages
  - id: no-placeholders
    severity: fail
    check: no TODO, TBD, FIXME, placeholder, lorem ipsum, 待补充, or 占位 text
  - id: evidence-visible
    severity: warn
    check: capability, quality, and risk pages cite graph node ids or source paths
