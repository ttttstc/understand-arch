name: wiki
version: 3.0
pages:
  - ARCHITECTURE.md
  - 01-overview.md
  - 02-components.md
  - 03-interfaces.md
  - 04-data-models.md
  - 05-capabilities.md
  - 06-quality.md
  - 07-risks-and-debt.md
  - 08-deployments.md
  - 09-flows-and-scenarios.md
  - 10-decisions.md
  - 11-changes.md
  - 12-rules.md
  - 13-pending-changes.md
  - 14-diagrams.md
gates:
  - id: long-form-primary
    severity: fail
    check: ARCHITECTURE.md exists, has a table of contents, and is the full 01-14 chapter concatenation rather than a separate summary
  - id: timestamp-present
    severity: fail
    check: every wiki page has generation time, base commit, and source line
  - id: projection-complete
    severity: fail
    check: non-empty arch-layer sections including narrative fields, flows, hotspots, and constraints must be covered by their mapped wiki pages
  - id: no-placeholders
    severity: fail
    check: no TODO, TBD, FIXME, placeholder, lorem ipsum, 待补充, or 占位 text
  - id: three-state-honesty
    severity: fail
    check: present facts are projected, absent facts are honestly declared absent, and uncertain facts are represented as known_unknowns
  - id: evidence-hidden
    severity: fail
    check: wiki正文和章节末尾都不出现 evidence; evidence_refs 只保留在 arch-layer.json, risk/qa/debt evidence_refs 必须回链代码且不能是内部 id
  - id: senior-q1-q7
    severity: fail
    check: full wiki review applies Q1 information density, Q2 decision support, Q3 coherence, Q4 evidence, Q5 insight depth, Q6 no hallucination, and Q7 audience fit
  - id: no-meta-narrative
    severity: fail
    check: Q8 holds; wiki reads as a project architecture document and contains no reading paths, glossaries, scan summaries, internal phases, field definitions, or tool limitation prose
