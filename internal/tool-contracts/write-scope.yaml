version: "2.0"

skills:
  arch-onboard:
    direct_writes:
      - "state.yaml"
      - "specs/repos.yaml"
      - ".metrics.jsonl"
    indirect_writes_via_dispatch:
      - "specs/repos/*/knowledge-graph.json"
      - "specs/repos/*/.fingerprint.json"
      - "specs/cross-repo.json"
      - "wiki/**"
    forbidden:
      - "decisions/**"
      - "change-requests/**"
      - "engine/**"
      - "rules/**"

  arch-design:
    direct_writes:
      - "state.yaml"
      - "change-requests/CR-*/CR.md"
      - ".metrics.jsonl"
    cross_repo_partial_writes:
      - "change_requests[]"
      - "traceability[]"
    indirect_writes_via_dispatch:
      - "decisions/ADR-*.md"
      - "cross-repo.json#architecture_decisions[]"
    forbidden:
      - "wiki/**"
      - "engine/**"
      - "rules/**"
      - "specs/repos/**"

  arch-audit:
    direct_writes:
      - "state.yaml"
      - ".metrics.jsonl"
      - "audit-{date}.md"
    indirect_writes_via_dispatch:
      - "specs/repos/*/.fingerprint.json"
    forbidden:
      - "specs/repos/*/knowledge-graph.json"
      - "specs/cross-repo.json"
      - "wiki/**"
      - "decisions/**"
      - "engine/**"
      - "rules/**"

  arch-wiki:
    direct_writes:
      - "state.yaml"
      - "wiki/**"
      - "wiki/.cache.json"
      - ".metrics.jsonl"
    forbidden:
      - "specs/**"
      - "decisions/**"
      - "change-requests/**"
      - "engine/**"
      - "rules/**"

  arch-diagram:
    direct_writes:
      - "state.yaml"
      - ".metrics.jsonl"
    forbidden:
      - "*"

  arch-analyze:
    direct_writes:
      - "specs/repos/*/knowledge-graph.json"
      - "specs/repos/*/.fingerprint.json"
      - "specs/cross-repo.json"
      - "specs/repos.yaml"
      - ".metrics.jsonl"
    forbidden:
      - "wiki/**"
      - "decisions/**"
      - "change-requests/**"

  arch-frame:
    direct_writes:
      - "change-requests/CR-*/PM问题清单.md"
      - "change-requests/CR-*/CR.md"
    forbidden:
      - "specs/**"
      - "wiki/**"
      - "decisions/**"

  arch-adr:
    direct_writes:
      - "decisions/ADR-*.md"
    cross_repo_partial_writes:
      - "architecture_decisions[]"
    forbidden:
      - "wiki/**"
      - "change-requests/**"
      - "engine/**"
      - "specs/repos/**"

  arch-review:
    direct_writes:
      - "change-requests/CR-*/CR.md"
      - "audit-{date}.md"
    forbidden:
      - "specs/**"
      - "wiki/**"
      - "decisions/**"
      - "engine/**"

forbidden_globally:
  - "*.tf"
  - "*.hcl"
  - "values*.yaml"
  - "helm/**"
  - "k8s/**"
  - ".github/workflows/**"
  - ".gitlab-ci.yml"
  - "Dockerfile"
  - "docker-compose*"
  - "openapi*"
  - "schema.sql"
  - "migrations/**"
  - "src/**"

